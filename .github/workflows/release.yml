name: Release

# Cuts a GitHub Release when a version tag is pushed. Publishing to pub.dev
# stays manual (see "Release order" in CONTRIBUTING.md) — this only creates the
# Release and attaches the matching CHANGELOG.md section as notes.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Pull the section for this version (from its heading to the next one).
          awk -v ver="$version" '
            $0 ~ "^## +" ver "( |$)" { inblock=1; next }
            inblock && /^## / { exit }
            inblock { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG.md section found for ${version}; using generated notes." >&2
            echo "See CHANGELOG.md for details." > release_notes.md
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release_notes.md \
            --verify-tag
